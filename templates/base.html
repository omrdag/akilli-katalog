
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akıllı Katalog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .navbar { background: #1d2024 !important; }
        .navbar-brand i { color: #f0b429; }
        .side .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin: 14px 0 4px; padding-left: 8px; }
        .side a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 4px; color: #1d2024; text-decoration: none; font-size: .9rem; }
        .side a:hover { background: #fff; }
        .side a.active { background: #1d2024; color: #fff; }
        .side a small { font-family: monospace; color: #64748b; }
        .side a.active small { color: #f0b429; }
        .side a .w { color: #b5401f; }
        .stat b { display: block; font-size: 1.5rem; line-height: 1; }
        .stat small { color: #64748b; text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; }
        .card.flag { outline: 1px solid #e8a089; }
        .pill { display: inline-block; background: #fbe5dd; color: #b5401f; border-radius: 3px; padding: 1px 6px; font-size: .68rem; font-weight: 600; }
        .product-card { transition: transform .15s, box-shadow .15s; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .sku-code { font-family: monospace; color: #c0397a; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-stars me-1"></i> Akıllı Katalog
            </a>
            <div class="d-flex gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-grid me-1"></i> Katalog
                </a>
                <a href="{{ url_for('sistem_kontrol') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-activity me-1"></i> Durum
                </a>
                <a href="{{ url_for('upload') }}" class="btn btn-light btn-sm">
                    <i class="bi bi-file-earmark-pdf me-1"></i> PDF Yükle
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
